[package]
name = "app-monitor"
version = "0.1.2"
edition = "2021"
description = "跨平台软件追踪下载器 / cross-platform software release tracker"
authors = ["lordquest <lordquest@163.com>"]
license = "MIT"

[features]
default = []
# 实验性 GPUI 前端（`--gpui`）。默认关闭：正式版仍走 egui，开启后两者共存，
# 因为 GPUI 的 Windows 后端要求 DirectX 11 + DirectComposition（Win10 及以上），
# 而 egui 版还承担 Win7/8 的 glow 兜底。
gpui-ui = ["dep:gpui"]

[dependencies]
# 双后端，按「DX12 → WARP → glow」顺序兜底（见 src/main.rs 的 RendererChoice）：
# Windows 上 DX12 覆盖新老显卡，没有显卡时由 WARP 软件光栅化顶上，最后才退 OpenGL。
eframe = { version = "0.29", default-features = false, features = ["glow", "wgpu", "default_fonts"] }
egui = "0.29"
# 只编 DX12 一个后端：绝不能让 wgpu 去枚举 Vulkan —— 老 NVIDIA 驱动（425.31 / Kepler）
# 在 Vulkan 首帧 present 时会在驱动内部访问违例崩溃，且 panic = "abort" 接不住。
wgpu = { version = "22.1", default-features = false, features = ["dx12"] }
# rustls-tls keeps the binary self-contained on Windows / Linux / macOS.
# gzip/brotli/deflate: the HTML parser is the hot path of a resolve, and the
# download sites serve 100-400KB pages; without decompression every one of them
# had to be requested with `Accept-Encoding: identity` to avoid unreadable bytes.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "http2",
    "rustls-tls",
    "gzip",
    "brotli",
    "deflate",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "sync"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# SHA-256 verification for GitHub release assets (GitHub publishes digests).
sha2 = "0.10"
hex = "0.4"
dirs = "6"
rfd = "0.15"
open = "5"
percent-encoding = "2"
log = "0.4"
gpui = { version = "0.2.2", optional = true }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
