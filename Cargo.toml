[package]
name = "app-monitor"
version = "0.1.0"
edition = "2021"
description = "跨平台软件追踪下载器 / cross-platform software release tracker"
authors = ["lordquest <lordquest@163.com>"]
license = "MIT"

[dependencies]
# Both backends are compiled in: wgpu (DX12/Metal/Vulkan) is the default because
# it survives broken WGL drivers, glow stays available via `AM_GL=1`.
eframe = { version = "0.29", default-features = false, features = ["glow", "wgpu", "default_fonts"] }
egui = "0.29"
# rustls-tls keeps the binary self-contained on Windows / Linux / macOS.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "http2", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "sync"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# SHA-256 verification for GitHub release assets (GitHub publishes digests).
sha2 = "0.10"
hex = "0.4"
dirs = "6"
rfd = "0.15"
open = "5"
percent-encoding = "2"
log = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
