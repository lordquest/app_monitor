[package]
name = "app-monitor"
version = "0.2.0"
edition = "2021"
description = "跨平台软件追踪下载器 / cross-platform software release tracker"
authors = ["lordquest <lordquest@163.com>"]
license = "MIT"

[dependencies]
# 界面层。GPUI 的 Windows 后端是 Direct3D 11 + DirectComposition（Win10+），
# macOS 走 Metal，Linux 走 Vulkan/blade —— 不需要我们自己维护后端选择与兜底链。
gpui = "0.2.2"
# rustls-tls keeps the binary self-contained on Windows / Linux / macOS.
# gzip/brotli/deflate: the HTML parser is the hot path of a resolve, and the
# download sites serve 100-400KB pages; without decompression every one of them
# had to be requested with `Accept-Encoding: identity` to avoid unreadable bytes.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "http2",
    "rustls-tls",
    "gzip",
    "brotli",
    "deflate",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "sync"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# SHA-256 verification for GitHub release assets (GitHub publishes digests).
sha2 = "0.10"
hex = "0.4"
dirs = "6"
rfd = "0.15"
open = "5"
percent-encoding = "2"
log = "0.4"

# ---- 仅为钉住一个版本而声明的依赖，代码里不直接用 ----
# gpui → gpui_http_client → zed-async-tar → xattr 0.2.3，而 xattr 0.2.3 在 Linux 上
# 引用了 `libc::ENOATTR`。libc 0.2.190 把这个早已 deprecated 的别名从 linux_like 里
# 删掉了，于是 ubuntu runner 上编译到 xattr 就报 E0425（"cannot find value ENOATTR"）。
# xattr 0.2.x 不再发布新版本，zed-async-tar 又写死 `xattr = "0.2"`，所以在只能在这里
# 把 libc 钉在还带该别名的最后一个版本上。等 zed-async-tar 换到 xattr 1.x 就能删掉。
[target.'cfg(target_os = "linux")'.dependencies]
libc = "=0.2.188"

# 把 assets/app.ico 编进 exe 资源段（build.rs）。
# GPUI 的 Windows 后端按资源 ID 1 取主图标，没有它 exe 就只有系统默认空白图标。
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
